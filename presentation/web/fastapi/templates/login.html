{% extends "base.html" %}
{% block content %}
<form method="post" action="/login">
    <div><h2>Вход</h2></div>
    <div class="centered">
        <div>
            <div><label class="description">Введите логин</label></div>
            <input type="text" name="username" required>
            
            <div><label class="description">Введите пароль</label></div>
            <input type="password" name="password" required>

            {% if error %}
                <div style="color: red;">{{ error }}</div>
            {% endif %}
        </div>
    </div>
    <div><button type="submit">Войти</button></div>
</form>
{% endblock %}
